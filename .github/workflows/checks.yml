name: Regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:db
  browsers:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: matrix.engine == 'chrome'
        run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - if: matrix.engine == 'webkit'
        run: node node_modules/playwright-core/cli.js install --with-deps webkit
      - name: Run mobile integration
        id: mobile
        shell: bash
        run: |
          mkdir -p qa-results
          set +e
          npm run test:browser > qa-results/run.log 2>&1
          test_exit=$?
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs");let s="passed";if(fs.existsSync("qa-results/failure-summary.json")){const d=JSON.parse(fs.readFileSync("qa-results/failure-summary.json","utf8"));s=d.stage+": "+d.message+" "+d.stack;}console.log("summary="+s.replace(/[\r\n]/g," ").slice(0,700))' >> "$GITHUB_OUTPUT"
          cat qa-results/run.log
        env:
          QA_BROWSER: ${{ matrix.engine }}
      - name: "Browser result — ${{ steps.mobile.outputs.summary }}"
        if: always()
        shell: bash
        run: test "${{ steps.mobile.outputs.exit_code }}" = "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-${{ matrix.engine }}
          path: qa-results/
          retention-days: 7
  release:
    needs: [regression, browsers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tag verified release
        shell: bash
        run: |
          release_tag="v$(node -p 'require("./package.json").version')"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            git tag "$release_tag"
            git push origin "refs/tags/$release_tag"
          fi
